name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  UV_VERSION: '0.13.6'
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.12'}
      - run: python -m pip install "uv==$UV_VERSION"
      - name: Install locked test and runtime dependencies
        run: uv sync --locked --extra dev --extra sdk-test
      - name: Reject stale container runtime requirements
        shell: bash
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt --no-header > "$RUNNER_TEMP/requirements.lock"
          diff -u requirements.lock "$RUNNER_TEMP/requirements.lock"
      - run: uv run --no-sync python -m ruff check .
      - run: uv run --no-sync python -m pytest -q
        timeout-minutes: 10
      - run: uv run --no-sync python -m pip_audit
      - name: Record tested dependency inventory
        run: |
          mkdir -p dependency-evidence
          cp pyproject.toml uv.lock requirements.lock dependency-evidence/
          uv run --no-sync python -m pip list --format=json > dependency-evidence/installed.json
          printf '%s\n' "$GITHUB_SHA" > dependency-evidence/tested-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-evidence-${{ github.sha }}
          path: dependency-evidence/
          retention-days: 14
          if-no-files-found: error
  deployments:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with: {version: v3.17.3}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.12'}
      - run: python -m pip install "uv==$UV_VERSION"
      - run: uv sync --locked --extra dev --extra sdk-test
      - name: Verify native systemd deployment units
        run: |
          command -v systemd-analyze
          uv run --no-sync python -m pytest --noconftest -q tests/test_systemd_deployment.py
      - name: Validate maintenance chart rendering
        run: uv run --no-sync python -m pytest --noconftest -q tests/test_maintenance_helm.py
      - run: helm lint deploy/helm/llm-gateway --set existingSecret=test-secret
      - run: helm template test deploy/helm/llm-gateway --set existingSecret=test-secret > /tmp/rendered.yaml
      - run: helm template test deploy/helm/llm-gateway -f deploy/helm/llm-gateway/values-ha.yaml --set existingSecret=test-secret --set networkPolicy.enabled=true > /tmp/rendered-ha.yaml
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with: {terraform_version: '1.10.5'}
      - run: terraform -chdir=deploy/terraform fmt -check
      - run: terraform -chdir=deploy/terraform init -backend=false
      - run: terraform -chdir=deploy/terraform validate
      - run: docker build -t automated-llm-proxy:ci .
      - name: Validate Prometheus alert rules
        run: docker run --rm --entrypoint /bin/promtool -v "$PWD/deploy/monitoring:/rules:ro" prom/prometheus:v3.2.1@sha256:6927e0919a144aa7616fd0137d4816816d42f6b816de3af269ab065250859a62 check rules /rules/prometheus-alerts.yaml
      - name: Test Prometheus alert behavior
        run: docker run --rm --entrypoint /bin/promtool -w /rules -v "$PWD/deploy/monitoring:/rules:ro" prom/prometheus:v3.2.1@sha256:6927e0919a144aa7616fd0137d4816816d42f6b816de3af269ab065250859a62 test rules /rules/prometheus-alerts.test.yaml
      - name: Validate Grafana dashboard structure
        run: python tests/browser/check-monitoring.py

  postgres-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: gateway_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://gateway:test-only-password@localhost:5432/gateway_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install "uv==$UV_VERSION"
      - run: uv sync --locked --extra dev --extra sdk-test
      - run: uv run --no-sync python -m pytest -q
        timeout-minutes: 10
      - name: Disposable PostgreSQL backup and restore acceptance
        env:
          DISPOSABLE_RESTORE_DRILL: '1'
        run: uv run --no-sync python tests/ops/restore_drill.py
        timeout-minutes: 10

  compose-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COMPOSE_FILE: compose.yaml:tests/browser/compose.mock.yaml
      MOCK_PROVIDER_URL: https://mock-provider:8443/v1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: npm ci --prefix tests/browser
      # Ubuntu 24.04 runners already include Chromium's shared libraries.
      # Avoid apt's optional font downloads; browser startup still validates dependencies.
      - run: npx playwright install chromium
        working-directory: tests/browser
        timeout-minutes: 5
      - name: Generate disposable installation secrets
        shell: bash
        run: |
          umask 077
          python - <<'PY'
          import base64, os, secrets
          password = secrets.token_urlsafe(32)
          values = {
              'POSTGRES_PASSWORD': password,
              'DATABASE_URL': f'postgresql+asyncpg://gateway:{password}@postgres:5432/gateway',
              'GATEWAY_MASTER_KEY': base64.urlsafe_b64encode(secrets.token_bytes(32)).decode(),
              'GATEWAY_SIGNING_KEY': secrets.token_urlsafe(48),
              'BOOTSTRAP_TOKEN': secrets.token_urlsafe(48),
          }
          with open('.env', 'x') as env, open(os.environ['GITHUB_ENV'], 'a') as github_env:
              for name, value in values.items():
                  print(f'::add-mask::{value}')
                  env.write(f'{name}={value}\n')
                  github_env.write(f'{name}={value}\n')
          PY
      - name: Build production image and disposable TLS test trust
        run: |
          sh tests/browser/mock-provider/generate-tls.sh
          docker build -t automated-llm-proxy:local .
      - name: Start image, migration, PostgreSQL and TLS mock upstream
        run: docker compose up --build --wait --wait-timeout 180 gateway
      - name: Exercise admin UI and HTTP authorization without paid providers
        run: npm test --prefix tests/browser
      - name: Verify schema and provider credential preflight
        run: docker compose exec -T gateway python -m gateway.check
      - name: Verify bounded load and worker loss across two replicas
        timeout-minutes: 7
        shell: bash
        run: |
          docker compose down --volumes --remove-orphans
          export COMPOSE_FILE=compose.yaml:tests/browser/compose.mock.yaml:tests/ops/compose.replicas.yaml
          export COMPOSE_PROJECT_NAME=thunderbolt-replica-drill
          trap 'docker compose down --volumes --remove-orphans' EXIT
          docker compose up -d --wait --wait-timeout 180 gateway gateway-peer
          DISPOSABLE_REPLICA_DRILL=1 python tests/ops/replica_drill.py
      - name: Show service status and diagnostics on failure
        if: failure()
        run: |
          if [ -f .env ]; then
            docker compose ps -a
            docker compose logs --no-color --tail=100
          fi
      - name: Remove disposable stack and secrets
        if: always()
        run: |
          if [ -f .env ]; then docker compose down --volumes --remove-orphans || true; fi
          if [ -f .env ]; then
            COMPOSE_FILE=compose.yaml:tests/browser/compose.mock.yaml:tests/ops/compose.replicas.yaml COMPOSE_PROJECT_NAME=thunderbolt-replica-drill docker compose down --volumes --remove-orphans || true
          fi
          rm -f .env tests/browser/mock-provider/tls/server.key tests/browser/mock-provider/tls/server.crt

  real-oidc:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: thunderbolt-oidc-ci
      NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/tests/oidc/generated/tls.crt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: npm ci --prefix tests/browser
      - run: npx playwright install chromium
        working-directory: tests/browser
        timeout-minutes: 5
      - name: Generate isolated realm, credentials and TLS trust
        run: |
          python tests/oidc/generate.py
          echo '127.0.0.1 idp.test gateway.test' | sudo tee -a /etc/hosts >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libnss3-tools
          mkdir -p "$HOME/.pki/nssdb"
          certutil -N --empty-password -d "sql:$HOME/.pki/nssdb"
          certutil -A -d "sql:$HOME/.pki/nssdb" -n thunderbolt-ci-only -t 'C,,' -i tests/oidc/generated/tls.crt
      - name: Build gateway and start official Keycloak fixture
        run: |
          docker build -t automated-llm-proxy:local .
          docker compose --env-file tests/oidc/generated/fixture.env -f tests/oidc/compose.yaml up --build -d
      - name: Wait for verified TLS discovery and gateway readiness
        timeout-minutes: 4
        shell: bash
        run: |
          for attempt in $(seq 1 90); do
            if curl --noproxy '*' --silent --fail --cacert tests/oidc/generated/tls.crt https://idp.test/realms/gateway-ci/.well-known/openid-configuration >/dev/null && \
               curl --noproxy '*' --silent --fail --cacert tests/oidc/generated/tls.crt https://gateway.test/health/ready >/dev/null; then exit 0; fi
            sleep 2
          done
          echo 'Disposable OIDC fixture did not become ready'; exit 1
      - name: Verify mounted-secret nonroot startup and source conflicts
        timeout-minutes: 2
        run: docker compose --env-file tests/oidc/generated/fixture.env -f tests/oidc/compose.yaml exec -T gateway python /fixture/check_mounted.py
      - name: Exercise real PKCE, groups, CSRF and signed logout
        run: node tests/browser/node_modules/@playwright/test/cli.js test --config tests/oidc/playwright.config.mjs
      - name: Show fixture status on failure
        if: failure()
        run: |
          if [ -f tests/oidc/generated/fixture.env ]; then
            docker compose --env-file tests/oidc/generated/fixture.env -f tests/oidc/compose.yaml ps -a
          fi
      - name: Remove disposable identity stack and secrets
        if: always()
        run: |
          if [ -f tests/oidc/generated/fixture.env ]; then
            docker compose --env-file tests/oidc/generated/fixture.env -f tests/oidc/compose.yaml down --volumes --remove-orphans || true
          fi
          rm -rf tests/oidc/generated
