name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]' pip-audit
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: python -m pip_audit
  deployments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.0
        with: {version: v3.17.3}
      - run: helm lint deploy/helm/llm-gateway --set existingSecret=test-secret
      - run: helm template test deploy/helm/llm-gateway --set existingSecret=test-secret > /tmp/rendered.yaml
      - run: helm template test deploy/helm/llm-gateway -f deploy/helm/llm-gateway/values-ha.yaml --set existingSecret=test-secret --set networkPolicy.enabled=true > /tmp/rendered-ha.yaml
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: '1.10.5'}
      - run: terraform -chdir=deploy/terraform fmt -check
      - run: terraform -chdir=deploy/terraform init -backend=false
      - run: terraform -chdir=deploy/terraform validate
      - run: docker build -t automated-llm-proxy:ci .

  postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: gateway_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://gateway:test-only-password@localhost:5432/gateway_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q

  compose-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: npm ci --prefix tests/browser
      # Ubuntu 24.04 runners already include Chromium's shared libraries.
      # Avoid apt's optional font downloads; browser startup still validates dependencies.
      - run: npx playwright install chromium
        working-directory: tests/browser
        timeout-minutes: 5
      - name: Generate disposable installation secrets
        shell: bash
        run: |
          umask 077
          python - <<'PY'
          import base64, os, secrets
          password = secrets.token_urlsafe(32)
          values = {
              'POSTGRES_PASSWORD': password,
              'DATABASE_URL': f'postgresql+asyncpg://gateway:{password}@postgres:5432/gateway',
              'GATEWAY_MASTER_KEY': base64.urlsafe_b64encode(secrets.token_bytes(32)).decode(),
              'GATEWAY_SIGNING_KEY': secrets.token_urlsafe(48),
              'BOOTSTRAP_TOKEN': secrets.token_urlsafe(48),
          }
          with open('.env', 'x') as env, open(os.environ['GITHUB_ENV'], 'a') as github_env:
              for name, value in values.items():
                  print(f'::add-mask::{value}')
                  env.write(f'{name}={value}\n')
                  github_env.write(f'{name}={value}\n')
          PY
      - name: Start actual image, migration job and PostgreSQL
        run: docker compose up --build --wait --wait-timeout 180 gateway
      - name: Exercise admin UI and HTTP authorization without paid providers
        run: npm test --prefix tests/browser
      - name: Show service status and diagnostics on failure
        if: failure()
        run: |
          if [ -f .env ]; then
            docker compose ps -a
            docker compose logs --no-color --tail=100
          fi
      - name: Remove disposable stack and secrets
        if: always()
        run: |
          if [ -f .env ]; then docker compose down --volumes --remove-orphans || true; fi
          rm -f .env
