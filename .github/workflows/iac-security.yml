name: IaC security
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iac-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checkov:
    name: Rendered Helm security (Checkov)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.17.3
      - name: Install isolated pinned Checkov scanner
        run: python -m pip install checkov==3.4.3
      - name: Render guarded standard and HA security profiles
        run: |
          mkdir -p iac-evidence
          printf '%s\n' "$GITHUB_SHA" > iac-evidence/tested-commit.txt
          checkov --version > iac-evidence/scanner-version.txt
          python -m pip list --format=json > iac-evidence/scanner-packages.json
          bash tools/security/render_iac.sh iac-evidence/rendered
          sha256sum iac-evidence/rendered/*.yaml > iac-evidence/rendered.sha256
      - name: Scan Kubernetes manifests with all built-in checks
        run: |
          checkov --directory iac-evidence/rendered --framework kubernetes --skip-download --output json > iac-evidence/checkov.json
          python tools/security/check_iac_report.py iac-evidence/checkov.json
      - name: Preserve bounded render and scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: iac-security-${{ github.sha }}
          path: iac-evidence/
          retention-days: 14
          if-no-files-found: error
