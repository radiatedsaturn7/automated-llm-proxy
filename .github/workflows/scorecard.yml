name: OpenSSF Scorecard
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'

# Analyze trusted default-branch content only. Never execute pull-request code
# with the publication permissions below, and never supply a broad PAT.
permissions: read-all
concurrency:
  group: scorecard-main
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Analyze public repository posture
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - name: Retain analysis evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openssf-scorecard-${{ github.sha }}
          path: scorecard.sarif
          retention-days: 90
          if-no-files-found: error
      - name: Publish GitHub code-scanning findings
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: scorecard.sarif
          category: openssf-scorecard
