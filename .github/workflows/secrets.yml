name: Secret scan
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: secrets-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned official Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$archive" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/gitleaks-cli"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-cli" gitleaks
          echo "$RUNNER_TEMP/gitleaks-cli" >> "$GITHUB_PATH"
      - name: Record scanner version and tested commit
        run: |
          gitleaks version
          git rev-parse HEAD
      - name: Verify scanner detection and redaction
        run: python tests/security/check-gitleaks.py
      - name: Scan complete fetched Git history
        run: >-
          gitleaks git . --config=.gitleaks.toml --gitleaks-ignore-path=.gitleaksignore
          --ignore-gitleaks-allow --redact=100 --no-banner --no-color
          --log-opts="--all" --timeout=300
          --report-format=json --report-path="${{ runner.temp }}/gitleaks-redacted.json"
