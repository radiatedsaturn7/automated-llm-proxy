name: Security
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'
permissions:
  contents: read
concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  bandit:
    name: Python SAST (Bandit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install isolated pinned scanner
        run: python -m pip install -r tools/security/requirements.txt
      - name: Scan all production Python and security tooling
        shell: bash
        run: |
          mkdir -p security-evidence
          printf '%s\n' "$GITHUB_SHA" > security-evidence/tested-commit.txt
          python -m bandit --version > security-evidence/scanner-version.txt
          python -m pip list --format=json > security-evidence/scanner-packages.json
          # Keep an unfiltered copy so reviewers can also see justified inline suppressions.
          set +e
          python -m bandit -r gateway tools/security --ignore-nosec -f json -o security-evidence/bandit-unfiltered.json
          raw_status=$?
          python -m bandit -r gateway tools/security -f json -o security-evidence/bandit.json
          scan_status=$?
          set -e
          # Bandit uses 1 for findings; every other nonzero status is a tooling failure.
          if [ "$raw_status" -gt 1 ] || [ "$scan_status" -ne 0 ]; then exit 1; fi
          python tools/security/check_report.py security-evidence/bandit.json
      - name: Preserve evidence even when the gate fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-evidence-${{ github.sha }}
          path: security-evidence/
          retention-days: 14
          if-no-files-found: error
