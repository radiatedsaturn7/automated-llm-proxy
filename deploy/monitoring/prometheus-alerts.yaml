groups:
  - name: thunderbolt
    rules:
      - alert: ThunderboltTargetDown
        expr: up{job="thunderbolt"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Brrrtgate scrape target is unavailable
          description: Check pod health, routing and the metrics credential before assuming inference is down.
      - alert: ThunderboltHttpErrorRate
        expr: |
          (sum(rate(gateway_http_requests_total{job="thunderbolt",status=~"5.."}[5m])) /
          clamp_min(sum(rate(gateway_http_requests_total{job="thunderbolt"}[5m])), 0.001)) > 0.05
          and sum(increase(gateway_http_requests_total{job="thunderbolt"}[5m])) > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Brrrtgate HTTP 5xx ratio exceeds 5 percent
          description: Inspect request IDs in metadata logs, provider availability and policy database health.
      - alert: ThunderboltControlPlaneLatency
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(gateway_http_request_duration_seconds_bucket{job="thunderbolt",route=~"/admin/api/.*|/auth/.*"}[5m]))) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Brrrtgate control-plane p95 latency exceeds two seconds
          description: Check database lock contention and identity provider response time.
      - alert: ThunderboltApplicationOverload
        expr: sum by (instance) (increase(gateway_overload_rejections_total{job="thunderbolt",pool="application"}[5m])) > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Brrrtgate is persistently shedding application traffic
          description: More than 20 application rejections per five minutes on this replica. Inspect rejection reasons, request duration, accounting backlog and database health before changing capacity or scaling.
      - alert: ThunderboltOperationsOverload
        expr: sum by (instance) (increase(gateway_overload_rejections_total{job="thunderbolt",pool="operations"}[5m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Brrrtgate operational HTTP capacity is persistently exhausted
          description: Health or metrics requests are being rejected on this replica. Check scraping frequency, probe traffic and slow readiness database calls; do not blindly increase application capacity.
