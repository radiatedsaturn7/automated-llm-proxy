# Test only: use after root compose.yaml and tests/browser/compose.mock.yaml.
services:
  mock-provider:
    volumes:
      - ./tests/ops/load_provider.py:/mock/server.py:ro
  gateway:
    restart: 'no'
    ports: !override ['127.0.0.1:8180:8080']
  gateway-peer:
    image: automated-llm-proxy:smoke
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set disposable DATABASE_URL}
      GATEWAY_MASTER_KEY: ${GATEWAY_MASTER_KEY:?Set disposable key}
      GATEWAY_SIGNING_KEY: ${GATEWAY_SIGNING_KEY:?Set disposable key}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:?Set disposable token}
      ALLOW_PRIVATE_PROVIDER_HOSTS: 'true'
    ports: ['127.0.0.1:8181:8080']
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      migrate:
        condition: service_completed_successfully
      mock-provider:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=3)"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: 'no'
